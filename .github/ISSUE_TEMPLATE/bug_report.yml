name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. A few details make it much easier to act on.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vito version
      description: From **Settings → About**, or run `vito version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Windows 11, or Fedora 42 with GNOME/Wayland. On Linux your desktop/compositor matters — please include it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Run `vito serve` in a terminal (or set `VITO_DEBUG=1`) and paste anything relevant.
      render: shell
