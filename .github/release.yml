# Controls GitHub's "Generate release notes" button: groups merged PRs since the
# previous tag into a categorised "What's Changed" list, with a Full Changelog link.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [fix, bug]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: 🔧 Other changes
      labels: ["*"]
