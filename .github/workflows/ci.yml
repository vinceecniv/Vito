name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The platform files are cgo, so each one only ever compiles on its own OS —
    # a Linux-only job cannot tell you whether the macOS build still works.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "1" # miniaudio (malgo) needs cgo; it dlopens ALSA/Pulse at runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest' # formatting is OS-independent; check it once
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # The branch ruleset requires a status check named exactly "build-test". A
  # matrix job cannot provide it: GitHub reports one check per entry, named
  # "checks (ubuntu-latest)" and "checks (macos-latest)", so the required name
  # would never appear and no pull request could ever merge. This gate carries
  # that name and passes only when every platform did.
  build-test:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: echo "all platform checks passed"
