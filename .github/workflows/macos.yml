name: macOS build

# Builds Vito-<version>.dmg on a GitHub macOS runner, so a release no longer
# needs a physical Mac: packaging/build-macos.sh only uses Apple's own tools
# (clang, lipo, codesign, hdiutil, sips), which the runner has.
#
# On a v* tag the dmg is attached to that release when one exists — usually
# the draft the Windows build created — and its checksum is written into the
# notes, exactly as `build-macos.sh <version> --release` does by hand. The dmg
# is always kept as a workflow artifact too, so a tag pushed before its release
# exists loses nothing: re-run the job, or start it by hand, once the draft is
# there.
#
# The result is ad-hoc signed like a local build (see build-macos.sh); testing
# it — permissions, hotkey, pasting — still needs a real Mac.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, e.g. 2026.10 (default: dev)"
        required: false
        default: ""
      release:
        description: "Attach to the GitHub release v<version>"
        type: boolean
        default: false

permissions:
  contents: write # gh release upload / edit

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            version="${{ inputs.version }}"
            release="${{ inputs.release }}"
          fi
          [ -n "$version" ] || version=dev
          [ "$version" != dev ] || release=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build the dmg
        run: bash packaging/build-macos.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Vito-${{ steps.v.outputs.version }}-macos
          path: |
            dist/Vito-${{ steps.v.outputs.version }}.dmg
            dist/Vito-${{ steps.v.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: steps.v.outputs.release == 'true'
        run: |
          version="${{ steps.v.outputs.version }}"
          if ! gh release view "v$version" >/dev/null 2>&1; then
            echo "::warning::No release v$version yet; the dmg is kept as a workflow artifact. Re-run this job once the release exists."
            exit 0
          fi
          # The dmg is already built; --release only uploads it and fills in
          # the checksum, but the script rebuilds first, so call the upload
          # half directly instead.
          cd dist
          gh release upload "v$version" "Vito-$version.dmg" "Vito-$version.dmg.sha256" --clobber
          sum="$(cut -d' ' -f1 "Vito-$version.dmg.sha256")"
          gh release view "v$version" --json body -q .body > notes.md
          SUM="$sum" NAME="Vito-$version.dmg" perl -pi -e \
            's/^(\s+)\S+(\s+)\Q$ENV{NAME}\E\s*$/$1$ENV{SUM}$2$ENV{NAME}\n/' notes.md
          if grep -qF "$sum  Vito-$version.dmg" notes.md; then
            gh release edit "v$version" --notes-file notes.md >/dev/null
            echo "checksum written into the release notes"
          else
            echo "::warning::No checksum line for Vito-$version.dmg in the release notes; add it by hand: $sum  Vito-$version.dmg"
          fi
