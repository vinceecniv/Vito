<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Press a hotkey, speak, clean text is pasted">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5E"></stop><stop offset="1" stop-color="#7C3AED"></stop>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B5E"></stop><stop offset="1" stop-color="#A78BFA"></stop>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="20"></rect></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#171221"></rect>
    <g font-family="ui-rounded, &#39;Arial Rounded MT Bold&#39;, &#39;Segoe UI&#39;, Verdana, sans-serif">
      
      <rect x="48" y="44" width="330" height="252" rx="20" fill="#1E1830" stroke="#FFFFFF" stroke-opacity="0.1"></rect>
      <text x="80" y="98" font-size="30" font-weight="800" fill="#FF6B5E">1</text>
      <text x="104" y="98" font-size="26" font-weight="800" fill="#F3EFFA">Press</text>
      
      <g>
        <rect x="80" y="128" width="86" height="58" rx="12" fill="#251E38" stroke="#FF6B5E" stroke-opacity="0.7" stroke-width="1.5"></rect>
        <text x="123" y="164" text-anchor="middle" font-size="21" font-weight="700" fill="#F3EFFA">Ctrl</text>
        <text x="182" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#A79FC0">+</text>
        <rect x="198" y="128" width="112" height="58" rx="12" fill="#251E38" stroke="#FF6B5E" stroke-opacity="0.7" stroke-width="1.5"></rect>
        <text x="254" y="164" text-anchor="middle" font-size="21" font-weight="700" fill="#F3EFFA">Space</text>
      </g>
      <text x="80" y="232" font-size="18" font-weight="600" fill="#A79FC0">One hotkey, anywhere on</text>
      <text x="80" y="258" font-size="18" font-weight="600" fill="#A79FC0">your system.</text>
      
      <g stroke="url(#arrow)" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M394 170h34"></path><path d="M420 158l12 12-12 12"></path>
      </g>
      
      <rect x="448" y="44" width="330" height="252" rx="20" fill="#1E1830" stroke="#FFFFFF" stroke-opacity="0.1"></rect>
      <text x="480" y="98" font-size="30" font-weight="800" fill="#A78BFA">2</text>
      <text x="506" y="98" font-size="26" font-weight="800" fill="#F3EFFA">Speak</text>
      
      <g>
        <circle cx="516" cy="157" r="30" fill="none" stroke="#A78BFA" stroke-width="2.5"></circle>
        <rect x="509" y="138" width="14" height="26" rx="7" fill="#A78BFA"></rect>
        <path d="M504 156a12 12 0 0 0 24 0M516 170v8" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
        <g fill="url(#brand)">
          <rect x="566" y="147" width="8" height="20" rx="4"></rect>
          <rect x="582" y="137" width="8" height="40" rx="4"></rect>
          <rect x="598" y="127" width="8" height="60" rx="4"></rect>
          <rect x="614" y="140" width="8" height="34" rx="4"></rect>
          <rect x="630" y="132" width="8" height="50" rx="4"></rect>
          <rect x="646" y="145" width="8" height="24" rx="4"></rect>
          <rect x="662" y="137" width="8" height="40" rx="4"></rect>
        </g>
      </g>
      <text x="480" y="232" font-size="18" font-weight="600" fill="#A79FC0">Talk naturally — &#34;uh&#34;s and</text>
      <text x="480" y="258" font-size="18" font-weight="600" fill="#A79FC0">detours are fine. 60 languages.</text>
      
      <g stroke="url(#arrow)" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M794 170h34"></path><path d="M820 158l12 12-12 12"></path>
      </g>
      
      <rect x="848" y="44" width="330" height="252" rx="20" fill="#1E1830" stroke="#FFFFFF" stroke-opacity="0.1"></rect>
      <text x="880" y="98" font-size="30" font-weight="800" fill="#FF6B5E">3</text>
      <text x="904" y="98" font-size="26" font-weight="800" fill="#F3EFFA">Paste</text>
      
      <g>
        <rect x="880" y="132" width="220" height="12" rx="6" fill="#F3EFFA" opacity="0.85"></rect>
        <rect x="880" y="156" width="180" height="12" rx="6" fill="#F3EFFA" opacity="0.6"></rect>
        <rect x="880" y="180" width="200" height="12" rx="6" fill="#F3EFFA" opacity="0.35"></rect>
        <path d="M1124 128l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="url(#brand)"></path>
        <path d="M1096 176l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" fill="#FF8A7A"></path>
      </g>
      <text x="880" y="232" font-size="18" font-weight="600" fill="#A79FC0">AI-cleaned text appears at</text>
      <text x="880" y="258" font-size="18" font-weight="600" fill="#A79FC0">your cursor — in any app.</text>
    </g>
    <rect x="0" y="336" width="1200" height="4" fill="url(#brand)"></rect>
  </g>
</svg>