<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#FAF6EF"/>

  <!-- step 1 -->
  <g transform="translate(70 70)">
    <rect width="300" height="160" rx="20" fill="#FFFFFF" stroke="#EDE7D9"/>
    <circle cx="52" cy="56" r="30" fill="url(#g)"/>
    <text x="52" y="66" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="100" y="52" font-size="24" font-weight="800" fill="#2B2440">Press</text>
    <text x="100" y="80" font-size="16" fill="#5A5470">Hit your hotkey —</text>
    <text x="100" y="102" font-size="16" fill="#5A5470">anywhere, any app.</text>
    <g transform="translate(24 118)" fill="#7C3AED">
      <rect width="60" height="26" rx="7" fill="#7C3AED" opacity="0.10"/>
      <text x="30" y="18" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">⌨ Ctrl+␣</text>
    </g>
  </g>
  <text x="392" y="158" font-size="34" fill="#B8AEDC">→</text>

  <!-- step 2 -->
  <g transform="translate(450 70)">
    <rect width="300" height="160" rx="20" fill="#FFFFFF" stroke="#EDE7D9"/>
    <circle cx="52" cy="56" r="30" fill="url(#g)"/>
    <text x="52" y="66" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="100" y="52" font-size="24" font-weight="800" fill="#2B2440">Speak</text>
    <text x="100" y="80" font-size="16" fill="#5A5470">Say it naturally.</text>
    <text x="100" y="102" font-size="16" fill="#5A5470">Live transcript shows.</text>
    <g transform="translate(24 122)" fill="url(#g)">
      <rect x="0"   y="6"  width="7" height="16" rx="3.5"/>
      <rect x="12"  y="0"  width="7" height="28" rx="3.5"/>
      <rect x="24"  y="-6" width="7" height="40" rx="3.5"/>
      <rect x="36"  y="-2" width="7" height="32" rx="3.5"/>
      <rect x="48"  y="8"  width="7" height="12" rx="3.5"/>
      <rect x="60"  y="-4" width="7" height="36" rx="3.5"/>
      <rect x="72"  y="4"  width="7" height="20" rx="3.5"/>
      <rect x="84"  y="-8" width="7" height="44" rx="3.5"/>
      <rect x="96"  y="2"  width="7" height="24" rx="3.5"/>
    </g>
  </g>
  <text x="772" y="158" font-size="34" fill="#B8AEDC">→</text>

  <!-- step 3 -->
  <g transform="translate(830 70)">
    <rect width="300" height="160" rx="20" fill="#FFFFFF" stroke="#EDE7D9"/>
    <circle cx="52" cy="56" r="30" fill="url(#g)"/>
    <text x="52" y="66" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="100" y="52" font-size="24" font-weight="800" fill="#2B2440">Paste</text>
    <text x="100" y="80" font-size="16" fill="#5A5470">Clean text lands</text>
    <text x="100" y="102" font-size="16" fill="#5A5470">at your cursor.</text>
    <g transform="translate(24 116)">
      <rect width="252" height="30" rx="7" fill="#FAF8F2" stroke="#E5DFD2"/>
      <text x="12" y="20" font-size="13" fill="#2B2440">Let's meet Tuesday at noon. 👍</text>
    </g>
  </g>
</svg>
