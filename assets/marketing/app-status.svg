<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" rx="16" fill="#17141F"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="230" height="640" rx="16" fill="#1C1826"/>
  <rect x="214" y="0" width="16" height="640" fill="#1C1826"/>
  <g transform="translate(24 26)">
    <rect width="44" height="44" rx="13" fill="url(#g)"/>
    <g fill="#fff" transform="translate(9 9) scale(0.26)">
      <rect x="4" y="22" width="12" height="20" rx="6"/><rect x="24" y="22" width="12" height="36" rx="6"/>
      <rect x="44" y="22" width="12" height="56" rx="6"/><rect x="64" y="22" width="12" height="36" rx="6"/>
      <rect x="84" y="22" width="12" height="20" rx="6"/>
    </g>
    <text x="58" y="24" font-size="22" font-weight="800" fill="#F2EFFA">Vito</text>
    <text x="59" y="40" font-size="10" font-weight="600" fill="#7A7292">VOICE IN · TEXT OUT</text>
  </g>
  <g transform="translate(16 108)" font-size="14" font-weight="600">
    <rect x="0" y="0" width="198" height="40" rx="10" fill="rgba(167,139,250,0.13)"/>
    <text x="16" y="26" fill="#C4B5FD">◉  Status</text>
    <text x="16" y="72" fill="#A79FC0">⚙  Settings</text>
    <text x="16" y="118" fill="#A79FC0">▤  History</text>
    <text x="16" y="164" fill="#A79FC0">✎  Dictionary</text>
    <text x="16" y="210" fill="#A79FC0">★  Statistics</text>
    <text x="16" y="256" fill="#A79FC0">🏆  Achievements</text>
  </g>
  <g transform="translate(16 470)">
    <rect width="198" height="44" rx="11" fill="url(#g)"/>
    <text x="99" y="28" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">●  Start dictation</text>
  </g>

  <!-- main -->
  <text x="270" y="52" font-size="26" font-weight="800" fill="#F2EFFA">Status</text>
  <g transform="translate(830 34)">
    <rect width="130" height="30" rx="15" fill="#2A2438"/>
    <circle cx="20" cy="15" r="5" fill="#FF6B5E"/>
    <text x="34" y="20" font-size="13" font-weight="600" fill="#A79FC0">Recording</text>
  </g>

  <!-- live transcript card -->
  <g transform="translate(270 78)">
    <rect width="690" height="200" rx="16" fill="#221D2E" stroke="#322B42"/>
    <text x="24" y="38" font-size="13" font-weight="700" fill="#7A7292">LIVE TRANSCRIPT</text>
    <text x="24" y="78" font-size="19" fill="#F2EFFA">Let's schedule the review for Tuesday</text>
    <text x="24" y="108" font-size="19" fill="#F2EFFA">at noon and send the notes after.</text>
    <text x="24" y="140" font-size="19" fill="#7A7292">um, and add a thumbs up emoji…</text>
    <!-- waveform -->
    <g transform="translate(24 158)" fill="url(#g)">
      <rect x="0" y="8" width="6" height="16" rx="3"/><rect x="11" y="2" width="6" height="28" rx="3"/>
      <rect x="22" y="-6" width="6" height="40" rx="3"/><rect x="33" y="0" width="6" height="30" rx="3"/>
      <rect x="44" y="10" width="6" height="12" rx="3"/><rect x="55" y="-4" width="6" height="36" rx="3"/>
      <rect x="66" y="4" width="6" height="22" rx="3"/><rect x="77" y="-8" width="6" height="44" rx="3"/>
      <rect x="88" y="2" width="6" height="26" rx="3"/><rect x="99" y="9" width="6" height="14" rx="3"/>
    </g>
    <g transform="translate(560 150)">
      <rect width="106" height="30" rx="8" fill="rgba(124,58,237,0.18)"/>
      <text x="53" y="20" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">✦ AI cleanup</text>
    </g>
  </g>

  <!-- cost card -->
  <g transform="translate(270 296)">
    <rect width="335" height="150" rx="16" fill="#221D2E" stroke="#322B42"/>
    <text x="24" y="38" font-size="13" font-weight="700" fill="#7A7292">THIS MONTH</text>
    <text x="24" y="86" font-size="40" font-weight="800" fill="#F2EFFA">€ 2.14</text>
    <text x="24" y="112" font-size="13" fill="#7A7292">Speech-to-text + AI cleanup</text>
    <text x="24" y="134" font-size="13" fill="#7A7292">≈ 14 hours dictated</text>
  </g>

  <!-- stats card -->
  <g transform="translate(625 296)">
    <rect width="335" height="150" rx="16" fill="#221D2E" stroke="#322B42"/>
    <text x="24" y="38" font-size="13" font-weight="700" fill="#7A7292">WORDS DICTATED</text>
    <text x="24" y="86" font-size="40" font-weight="800" fill="#F2EFFA">48,920</text>
    <g transform="translate(24 104)" fill="url(#g)">
      <rect x="0" y="18" width="18" height="18" rx="3"/><rect x="26" y="8" width="18" height="28" rx="3"/>
      <rect x="52" y="14" width="18" height="22" rx="3"/><rect x="78" y="0" width="18" height="36" rx="3"/>
      <rect x="104" y="10" width="18" height="26" rx="3"/><rect x="130" y="6" width="18" height="30" rx="3"/>
      <rect x="156" y="16" width="18" height="20" rx="3"/><rect x="182" y="2" width="18" height="34" rx="3"/>
      <rect x="208" y="12" width="18" height="24" rx="3"/><rect x="234" y="8" width="18" height="28" rx="3"/>
      <rect x="260" y="18" width="18" height="18" rx="3"/><rect x="286" y="4" width="18" height="32" rx="3"/>
    </g>
  </g>

  <!-- bottom latency -->
  <g transform="translate(270 466)">
    <rect width="690" height="150" rx="16" fill="#221D2E" stroke="#322B42"/>
    <text x="24" y="38" font-size="13" font-weight="700" fill="#7A7292">LAST RUN</text>
    <g font-size="14" fill="#A79FC0">
      <text x="24" y="74">Capture → transcript</text>
      <text x="24" y="104">AI cleanup</text>
      <text x="24" y="134">Pasted at cursor</text>
    </g>
    <g font-size="14" font-weight="700" fill="#F2EFFA" text-anchor="end">
      <text x="666" y="74">380 ms</text>
      <text x="666" y="104">640 ms</text>
      <text x="666" y="134">1.1 s total</text>
    </g>
  </g>
</svg>
