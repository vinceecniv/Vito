<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1626"/><stop offset="1" stop-color="#241633"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A7E"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="150" fill="#7C3AED" opacity="0.28" filter="url(#soft)"/>
  <circle cx="1120" cy="300" r="130" fill="#FF6B5E" opacity="0.22" filter="url(#soft)"/>

  <!-- logo tile -->
  <g transform="translate(96 108)">
    <rect width="120" height="120" rx="30" fill="url(#grad)"/>
    <g fill="#fff" transform="translate(20 20) scale(0.58)">
      <rect x="4"  y="22" width="14" height="24" rx="7"/>
      <rect x="30" y="14" width="14" height="40" rx="7"/>
      <rect x="56" y="4"  width="14" height="60" rx="7"/>
      <rect x="82" y="14" width="14" height="40" rx="7"/>
      <rect x="108" y="22" width="14" height="24" rx="7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="252" y="176" font-size="86" font-weight="800" fill="#F5F2FB" letter-spacing="-2">Vito</text>
  <text x="256" y="230" font-size="27" font-weight="700" fill="url(#txt)" letter-spacing="1">Voice In · Text Out</text>
  <text x="256" y="272" font-size="21" font-weight="500" fill="#B3AAC8">Speak anywhere. Get clean text at your cursor.</text>

  <!-- pills -->
  <g font-size="16" font-weight="600">
    <g transform="translate(256 300)">
      <rect width="200" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
      <text x="18" y="23" fill="#D9D2E8">Bring Your Own Key</text>
    </g>
    <g transform="translate(468 300)">
      <rect width="150" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
      <text x="18" y="23" fill="#D9D2E8">60 languages</text>
    </g>
    <g transform="translate(630 300)">
      <rect width="160" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
      <text x="18" y="23" fill="#D9D2E8">Open source</text>
    </g>
  </g>

  <!-- big waveform -->
  <g transform="translate(880 150)" fill="url(#grad)" opacity="0.92">
    <rect x="0"   y="20"  width="12" height="40"  rx="6"/>
    <rect x="24"  y="0"   width="12" height="80"  rx="6"/>
    <rect x="48"  y="-30" width="12" height="140" rx="6"/>
    <rect x="72"  y="-52" width="12" height="184" rx="6"/>
    <rect x="96"  y="-20" width="12" height="120" rx="6"/>
    <rect x="120" y="10"  width="12" height="60"  rx="6"/>
    <rect x="144" y="-36" width="12" height="152" rx="6"/>
    <rect x="168" y="-8"  width="12" height="96"  rx="6"/>
    <rect x="192" y="24"  width="12" height="32"  rx="6"/>
  </g>
</svg>
